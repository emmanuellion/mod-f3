plugins {
    id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // Minecraft + mappings officiels
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Umbrella Fabric API (HudRenderCallback, DrawContext, etc.)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    // Sépare bien les sources client/commun
    splitEnvironmentSourceSets()

    // Dis à Loom que ton mod combine les sources main + client
    mods {
        create("modid") {  // "modid" = l'ID défini dans fabric.mod.json
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}